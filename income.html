<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income — Budget Ledger</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div class="topbar-brand">Budget Ledger</div>
    <nav class="topbar-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="reports.html" id="navReports">Reports</a>
      <a href="loans.html" id="navLoans">Loans</a>
      <a href="income.html" id="navIncome" class="active">Income</a>
      <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
      <a href="account.html">Account</a>
    </nav>
    <div class="topbar-user">
      <span class="badge" id="roleBadge">…</span>
      <button class="btn-ghost" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main class="app-main">
    <div class="viewing-banner" id="viewingBanner" style="display:none;">
      <div class="viewing-who">
        <span class="badge" id="viewingBadge"></span>
        <span class="viewing-name" id="viewingName"></span>
        <span class="viewing-email" id="viewingEmail"></span>
      </div>
      <span class="muted-note" id="viewingAccessNote"></span>
    </div>

    <h1 id="incomeTitle">Income</h1>

    <div class="empty-state" id="featureLockedMessage" style="display:none;">
      Income isn't enabled for you yet — ask an admin to turn it on.
    </div>

    <div id="incomeContent">
      <div class="month-nav">
        <button class="btn-ghost" id="prevMonth">← Prev</button>
        <span class="month-label" id="monthLabel">—</span>
        <button class="btn-ghost" id="nextMonth">Next →</button>
      </div>

      <div class="summary-strip" id="summaryStrip"></div>

      <div class="status-banner" id="statusBanner"></div>

      <section class="panel">
        <div class="panel-head">
          <h2>Income sources</h2>
          <div id="addIncomeSourceBox" style="display:none;">
            <input type="text" id="newIncomeSourceName" placeholder="New source name" class="inline-input">
            <button class="save-btn" id="addIncomeSourceBtn">Add</button>
          </div>
        </div>
        <div class="grant-list" id="incomeSourceChips"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Log income</h2>
        </div>
        <form id="incomeForm" class="expense-form" style="display:none;">
          <div class="field">
            <label for="incSource">Source</label>
            <select id="incSource"></select>
          </div>
          <div class="field">
            <label for="incAmount">Amount</label>
            <input type="number" id="incAmount" min="0" step="1" placeholder="0">
          </div>
          <div class="field">
            <label for="incDate">Date</label>
            <div class="date-field">
              <input type="date" id="incDate">
              <span class="date-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              </span>
            </div>
          </div>
          <div class="field expense-note-field">
            <label for="incNote">Note (optional)</label>
            <input type="text" id="incNote" placeholder="Where did this come from?">
          </div>
          <button type="submit" class="btn btn-primary">Add income</button>
        </form>
        <p class="muted-note" id="incomeViewOnlyNote" style="display:none;">You have view-only access — income can't be added.</p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>This month's income</h2>
        </div>
        <div class="table-scroll">
          <table class="admin-table" id="incomeTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Source</th>
                <th>Amount</th>
                <th>Note</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="incomeTableBody"></tbody>
          </table>
        </div>
        <div class="empty-state" id="incomeEmptyState" style="display:none;">No income logged for this month yet.</div>
      </section>
    </div>
  </main>
</div>

<script src="api-bridge.js"></script>
<script src="ui-helpers.js"></script>
<script src="income.js"></script>
</body>
</html>
